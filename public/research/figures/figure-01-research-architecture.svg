<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Four-layer research architecture</title><desc id="d">Observed public evidence flows through transparent derivation and bounded analysis into optional conditional simulation.</desc><defs><linearGradient id="g"><stop stop-color="#31d5e7"/><stop offset="1" stop-color="#8e6cff"/></linearGradient></defs><rect width="1600" height="900" fill="#020713"/><path d="M0 110H1600M0 790H1600" stroke="#16304d"/><text x="90" y="90" fill="#62dce1" font-family="Arial" font-size="18" letter-spacing="4">NEXORA / REPRODUCIBLE RESEARCH FIGURE</text><text x="90" y="170" fill="#eef6ff" font-family="Arial" font-size="54">Four-layer research architecture</text><g><rect x="90" y="290" width="310" height="190" rx="8" fill="#071629" stroke="#31d5e7"/><text x="120" y="352" fill="#31d5e7" font-family="Arial" font-size="20">01 / OBSERVED</text><text x="120" y="402" fill="#edf5ff" font-family="Arial" font-size="26">Public records</text></g><g><rect x="450" y="290" width="310" height="190" rx="8" fill="#071629" stroke="#4ea2ff"/><text x="480" y="352" fill="#4ea2ff" font-family="Arial" font-size="20">02 / DERIVED</text><text x="480" y="402" fill="#edf5ff" font-family="Arial" font-size="26">Transparent transforms</text></g><g><rect x="810" y="290" width="310" height="190" rx="8" fill="#071629" stroke="#7775ff"/><text x="840" y="352" fill="#7775ff" font-family="Arial" font-size="20">03 / ANALYTICAL</text><text x="840" y="402" fill="#edf5ff" font-family="Arial" font-size="26">Bounded interpretation</text></g><g><rect x="1170" y="290" width="310" height="190" rx="8" fill="#071629" stroke="#a56cff"/><text x="1200" y="352" fill="#a56cff" font-family="Arial" font-size="20">04 / SIMULATION</text><text x="1200" y="402" fill="#edf5ff" font-family="Arial" font-size="26">Conditional scenarios</text></g><path d="M400 385H440M760 385H800M1120 385H1160" stroke="url(#g)" stroke-width="4"/><text x="90" y="590" fill="#a5b9cc" font-family="Arial" font-size="27">Source → snapshot → validation → derivation → analysis → explicit model</text><text x="90" y="650" fill="#728aa0" font-family="Arial" font-size="21">Evidence class, provenance, uncertainty and limitations remain visible at every layer.</text><text x="90" y="840" fill="#7189a2" font-family="monospace" font-size="15">MODEL 2.0.0-RESEARCH-DESIGN · HASH 6c1b26e9 · CONCEPTUAL · NOT A FORECAST</text></svg>